name: Release (sign, notarize, publish)

# On a version tag (e.g. v0.4.0) this builds the menu bar app, signs it with the
# Developer ID certificate, notarizes + staples it with Apple, attaches the
# notarized tarball to the GitHub release, and updates the Homebrew tap formula.
#
# Required repository secrets (see packaging/SIGNING.md and
# scripts/setup-ci-secrets.sh):
#   DEVELOPER_ID_CERT_P12       base64 of the exported .p12 (cert + private key)
#   DEVELOPER_ID_CERT_PASSWORD  password used when exporting the .p12
#   NOTARY_APPLE_ID             Apple ID email used for notarization
#   NOTARY_TEAM_ID              Developer Team ID (e.g. U8A2AFWXCM)
#   NOTARY_PASSWORD             app-specific password for that Apple ID
#   TAP_GITHUB_TOKEN            token that can push to Zsoldier/homebrew-tap

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Guard — signing secrets present
        id: guard
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::error::Signing secrets not configured; see packaging/SIGNING.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Keychain Access exports .p12 with legacy (RC2-40) encryption that
          # newer macOS `security import` can't read. Decrypt with OpenSSL's
          # legacy provider to PEM, then rebuild a clean modern p12.
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" \
            -passin pass:"$CERT_PASSWORD" -nodes -out "$RUNNER_TEMP/all.pem"

          # The export can contain multiple private keys (e.g. an old Personal
          # Team key alongside the Developer ID key) but only the Developer ID
          # certificate. Naively re-exporting grabs the FIRST key, which may not
          # match the cert -> no identity forms on import. So split the PEM and
          # pair the cert with the private key whose public key actually matches.
          cd "$RUNNER_TEMP"
          # Split the PEM bundle into individual cert/key pieces (BSD-awk safe).
          awk '/-----BEGIN/{ n++; f=sprintf("piece-%02d.pem", n) } n>0{ print > f }' all.pem

          CERT=""; declare -a KEYS=()
          for p in piece-*.pem; do
            [ -f "$p" ] || continue
            if grep -q 'BEGIN CERTIFICATE' "$p"; then CERT="$p"; fi
            if grep -q 'PRIVATE KEY' "$p"; then KEYS+=("$p"); fi
          done
          if [ -z "$CERT" ]; then echo "::error::No certificate in export."; exit 1; fi

          CPUB="$(openssl x509 -in "$CERT" -noout -pubkey)"
          MATCH=""
          for kf in "${KEYS[@]}"; do
            if [ "$(openssl pkey -in "$kf" -pubout 2>/dev/null)" = "$CPUB" ]; then
              MATCH="$kf"; break
            fi
          done
          if [ -z "$MATCH" ]; then
            echo "::error::No private key matching the certificate found in export."
            exit 1
          fi

          openssl pkcs12 -export -inkey "$MATCH" -in "$CERT" \
            -passout pass:"$CERT_PASSWORD" -out "$RUNNER_TEMP/modern.p12"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/modern.p12" -P "$CERT_PASSWORD" \
            -A -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "All identities in signing keychain (unfiltered):"
          security find-identity "$KEYCHAIN" || true
          echo "Codesigning-policy identities:"
          security find-identity -p codesigning "$KEYCHAIN" || true

          # Confirm a real identity (cert + matching private key) landed in the
          # keychain. `-p codesigning` can hide it in an isolated keychain that
          # lacks Apple's intermediate to complete the chain, so check the
          # unfiltered list for the presence of our Developer ID cert.
          if ! security find-identity "$KEYCHAIN" | grep -q 'Developer ID Application'; then
            echo "::error::No Developer ID Application identity imported into keychain."
            exit 1
          fi
          # Reference the identity by its SHA-1 fingerprint so codesign locates
          # the exact cert+key pair regardless of policy/chain evaluation.
          IDENTITY="$(openssl x509 -in "$CERT" -noout -fingerprint -sha1 \
            | sed 's/.*=//; s/://g')"
          echo "DEVELOPER_ID_APP=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported identity fingerprint: $IDENTITY"
          rm -f "$RUNNER_TEMP"/cert.p12 "$RUNNER_TEMP"/all.pem \
            "$RUNNER_TEMP"/modern.p12 "$RUNNER_TEMP"/piece-*.pem

      - name: Build, sign, notarize, package
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-signed-app.sh "$VERSION"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          ASSET="dist/mic-music-pause-${VERSION}-macos.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --generate-notes
          fi

      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN not set; skipping tap update."
            exit 0
          fi
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          SRC_URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          SRC_SHA="$(curl -sL "$SRC_URL" | shasum -a 256 | awk '{print $1}')"
          APP_URL="https://github.com/${REPO}/releases/download/${TAG}/mic-music-pause-${VERSION}-macos.tar.gz"
          APP_SHA="$(shasum -a 256 "dist/mic-music-pause-${VERSION}-macos.tar.gz" | awk '{print $1}')"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Zsoldier/homebrew-tap.git" tap
          FORMULA="tap/Formula/mic-music-pause.rb"
          # 2-space indent = top-level (source); 4-space indent = resource "app".
          sed -i '' -E \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  url \".*\"|  url \"${SRC_URL}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SRC_SHA}\"|" \
            -e "s|^    url \".*\"|    url \"${APP_URL}\"|" \
            -e "s|^    sha256 \".*\"|    sha256 \"${APP_SHA}\"|" \
            "$FORMULA"
          echo "----- updated formula -----"
          cat "$FORMULA"
          cd tap
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mic-music-pause ${VERSION} (notarized)"
          git push
